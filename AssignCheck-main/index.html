  <rect width="200" height="200" fill="url(#bg)"/>
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="#ffffff"/>
    <text x="30" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#14171f">A</text>
    <circle cx="58" cy="58" r="13" fill="#ffffff" stroke="#14171f" stroke-width="4"/>
    <path d="M52 58 L57 63 L65 54" stroke="#1f2a6e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
