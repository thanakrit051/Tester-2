/* เช็คชื่อคาบนี้วันนี้แล้ว = ตัวหนังสือสีเขียวตัวหนา (ช่องอื่นน้ำหนักปกติ ให้ต่างกันชัด) */
.week-cell b { font-weight: 500; }
.week-cell[data-done="1"] b { font-weight: 800; }
.week-cell[data-done="1"] :is(b, small) { color: var(--st-ok); }
.week-cell[data-done="1"][data-cur="1"] :is(b, small) { color: inherit; }
/* จอแคบ ช่องเล็กเกินจะใส่ชื่อวิชา — โชว์แค่ห้อง (ชื่อเต็มอยู่ใน title) */
@media (max-width: 520px) {
  .week-cell small { display: none; }
  .week-p small { display: none; }
  .week-table th.week-d { width: 24px; }
}
@media (min-width: 900px) {
  .home-grid[data-solo="1"] { grid-template-columns: 1fr; }
}

.tt-tip {
  display: flex; align-items: center; gap: 6px; margin: 12px 0 0;
  border: 1px dashed var(--line-2); border-radius: var(--r-2); padding: 4px 4px 4px 14px;
}
.tt-tip-main { flex: 1; display: grid; gap: 1px; text-align: left; padding: 8px 0; color: var(--ink); }
.tt-tip-main b { font-size: var(--fs-md); color: var(--accent-ink); }
.tt-tip-main span { font-size: var(--fs-sm); color: var(--ink-2); }

/* กล่องตั้งตารางสอน */
.tt-days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.tt-days button {
  min-height: 48px; border-radius: var(--r-1); display: grid; place-content: center; line-height: 1.2;
  background: var(--surface-2); color: var(--ink-2);
}
.tt-days b { font-size: var(--fs-base); }
.tt-days small { font-size: var(--fs-2xs); }
.tt-days button[data-on="1"] { background: var(--ink); color: var(--on-ink); }
.tt-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.tt-tools > b { flex: 1; font-size: var(--fs-base); }
.tt-list { border: 1px solid var(--line); border-radius: var(--r-2); overflow: hidden; }
.tt-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-top: 1px solid var(--line); }
.tt-list > .tt-row:first-child { border-top: 0; }
.tt-when { width: 92px; flex: none; display: grid; line-height: 1.3; }
.tt-when b { font-size: var(--fs-md); }
.tt-when > span { font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tt-row select { flex: 1; min-width: 0; min-height: 44px; }
.tt-row select[data-set="0"] { color: var(--ink-3); }
.tt-times { display: flex !important; align-items: center; gap: 2px; }
.tt-time { width: 100%; min-width: 0; padding: 4px 2px; font-size: var(--fs-sm); min-height: 32px; }
.tt-row:has(.tt-times) .tt-when { width: 150px; }
/* คาบคู่ — แถบติ๊กคั่นระหว่าง 2 คาบที่เป็นห้องเดียวกัน (เยื้องให้ตรงกับช่องเลือกห้อง) */
.tt-join {
  display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 0;
  padding: 4px 10px 4px 112px; border-top: 1px dashed var(--line); cursor: pointer;
}
.tt-join + .tt-row { border-top: 0; }
.tt-join input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--ink); }
.tt-join span { display: grid; line-height: 1.3; }
.tt-join b { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.tt-join small { font-size: var(--fs-xs); color: var(--ink-3); }
.tt-join[data-on="1"] { background: var(--accent-soft); }
.tt-join[data-on="1"] b { color: var(--accent-ink); }
.tt-row:has(.tt-times) + .tt-join, .tt-list:has(.tt-times) .tt-join { padding-left: 170px; }
@media (max-width: 420px) { .tt-join, .tt-list:has(.tt-times) .tt-join { padding-left: 10px; } }

/* ══ v3.13 · เพิ่มงานลงหลายห้อง ════════════════════════════ */
.room-list { border: 1px solid var(--line); border-radius: var(--r-2); overflow: hidden; }
.room-list + .room-list { margin-top: 8px; }
.room-list[hidden] { display: none; }
.room-row, .field .room-row {
  display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding: 6px 14px; border-top: 1px solid var(--line); cursor: pointer;
  font-size: var(--fs-md); color: var(--ink); font-weight: 400; margin: 0;
}
.room-row:first-child { border-top: 0; }
.room-row[data-me="1"] { background: var(--surface-2); cursor: default; }
.room-row input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
.room-main { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.room-main b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-main small { font-size: var(--fs-xs); color: var(--ink-2); }
.room-tag { flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--accent-ink); }
.room-tag[data-me="1"] { color: var(--ink-2); }
/* ขึ้นภาคเรียนใหม่ — แถวห้องมีตัวเลือกทางขวาแทนช่องติ๊ก */
.nt-list select { width: auto; flex: none; padding: 8px 30px 8px 10px; font-size: var(--fs-md); }
.nt-check { display: block; margin-bottom: 12px; }
.nt-notes { margin: 0 0 14px; padding-left: 20px; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.7; }
.room-more {
  min-height: 40px; margin-top: 4px; padding: 0 2px;
  font-size: var(--fs-md); font-weight: 600; color: var(--accent-ink);
}

/* ══ v3.13 · ตามงาน → คัดลอกไปไลน์ ══════════════════════════ */
.chase-opt, .field .chase-opt {
  display: flex; align-items: center; gap: 12px; min-height: 52px; margin: 0 0 8px;
  padding: 6px 14px; border-radius: var(--r-1); background: var(--surface-2); cursor: pointer;
}
.chase-opt input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
.chase-opt > span { display: grid; line-height: 1.35; }
.chase-opt b { font-size: var(--fs-md); color: var(--ink); }
.chase-opt small { font-size: var(--fs-xs); color: var(--ink-2); }
/* ตัวอย่างข้อความ — หน้าตาคล้ายฟองแชตให้รู้ว่าจะออกไปเป็นแบบไหน */
.chase-msg {
  white-space: pre-line; font-size: var(--fs-md); line-height: 1.65; color: var(--ink);
  background: var(--surface-2); border-radius: 4px 16px 16px 16px; padding: 12px 14px;
  max-height: 40vh; overflow-y: auto; user-select: text; -webkit-user-select: text;
}

/* ══ v3.13 · สุ่มเรียกชื่อ ══════════════════════════════════ */
.list-end { margin-top: 12px; }
.find-row { display: flex; gap: 8px; align-items: flex-start; }
/* มือถือ: ช่องค้นหาซ่อนจนกว่าจะแตะไอคอนบนแถบหัว (หน้าเช็คชื่อ) */
@media (max-width: 899px) { .find-row.m-collapsed { display: none; } }
.find-row > .find-box { flex: 1; min-width: 0; }
/* บอกปุ่มลัดเช็คชื่อ (PC เท่านั้น — มือถือไม่มีแป้นพิมพ์จริง) */
.kbd-hint { font-size: var(--fs-xs); color: var(--ink-2); margin: -2px 2px 10px; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 5px; border-radius: var(--r-xs);
  border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--surface);
  font: inherit; font-weight: 600; text-align: center; color: var(--ink); line-height: 1.5;
}
.dice-btn {
  flex: none; width: 44px; height: 44px; border-radius: var(--r-1); font-size: var(--fs-xl);
  background: var(--surface); border: 1px solid var(--line-2);
}
.pick-card {
  display: grid; justify-items: center; gap: 4px; text-align: center;
  padding: 26px 14px; margin-bottom: 10px; border-radius: var(--r-3);
  background: var(--hero); color: #fff;
}
.pick-sub { font-size: var(--fs-md); color: var(--hero-ink); }
.pick-name { font-size: var(--fs-3xl); font-weight: 700; line-height: 1.3; }

/* ══ v3.13 · พิมพ์ (ใบเช็คชื่อเปล่า · สรุป SGS) ═══════════════
   เนื้อหาที่จะพิมพ์ถูกวางไว้ใน #print-area (ดู printPage ใน js/dom.js)
   ตอนพิมพ์ซ่อนทุกอย่างของแอป เหลือแค่กระดาษขาว ตัวอักษรดำ เส้นตารางชัด */
#print-area { display: none; color: #000; font-size: 10.5pt; }
/* วัดความสูงก่อนพิมพ์ (printPage ใน js/dom.js) — วางไว้นอกจอ กว้างเท่าพื้นที่พิมพ์ของ A4 */
#print-area.measure { display: block; position: absolute; left: -10000px; top: 0; width: var(--pw, 190mm); }
@media print {
  /* html ก็ต้องขาว — เดิมพื้นเทาของแอปโผล่ใต้เนื้อหา (เครื่องที่ติ๊ก "พิมพ์กราฟิกพื้นหลัง") */
  html, body.printing { background: #fff !important; }
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing #print-area { display: block; color: #000; font-size: 10.5pt; }
}
/* กฎของเนื้อหาที่พิมพ์อยู่นอก @media print — ใช้ตอนวัดขนาดบนจอด้วย (บนจอ #print-area ซ่อนอยู่เสมอ) */
#print-area .print-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin-bottom: 6mm; padding-bottom: 2mm; border-bottom: 1.5px solid #000;
}
#print-area .print-head b { font-size: 13pt; }
#print-area .print-foot {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 6mm; font-size: 9.5pt;
}
#print-area table.print-grid { width: 100%; border-collapse: collapse; }
#print-area .print-grid th,
#print-area .print-grid td {
  border: 1px solid #000; padding: 3px 4px; color: #000 !important;
  background: #fff !important; position: static !important; box-shadow: none !important;
}
#print-area .print-grid thead th { font-weight: 700; }
#print-area .print-grid tr { break-inside: avoid; }
#print-area .print-grid thead { display: table-header-group; }   /* หัวตารางซ้ำทุกหน้า */
#print-area .pg-no { width: 12mm; text-align: center; white-space: nowrap; }
#print-area .pg-sid { width: 24mm; white-space: nowrap; }
#print-area .pg-name { width: 52mm; white-space: nowrap; }
#print-area .pg-day { width: auto; }
#print-area .pg-sub th { font-weight: 400; font-size: 8.5pt; height: 7mm; }
#print-area tbody td { height: 6.5mm; }
/* ตาราง SGS มีสีพื้นหลัง/จุดเตือนตามจอ — กระดาษไม่ต้องใช้ */
#print-area .dot-pend { display: none; }
#print-area .print-grid div { color: #000 !important; }

/* ══ v3.13 · QR ลิงก์หน้านักเรียน ═══════════════════════════ */
.qr-box {
  width: 200px; max-width: 70%; margin: 4px auto 12px; padding: 6px;
  background: #fff; border-radius: var(--r-2); box-shadow: var(--sh-1);
}
.qr-box svg, .qr-poster-code svg { display: block; width: 100%; height: auto; }
@media print {
  #print-area .qr-poster { text-align: center; padding-top: 12mm; }
  #print-area .qr-poster-title { font-size: 34pt; font-weight: 700; }
  #print-area .qr-poster-sub { font-size: 14pt; margin-top: 2mm; }
  #print-area .qr-poster-code { width: 120mm; margin: 12mm auto; }
  #print-area .qr-poster-steps {
    display: inline-block; text-align: left; font-size: 15pt; line-height: 1.8; margin: 0;
  }
  #print-area .qr-poster-link { margin-top: 12mm; font-size: 8.5pt; color: #444; word-break: break-all; }
}

/* ใบรายงานผู้ปกครอง (report.js · slipFor) — คนละแผ่น ขาวดำล้วน ถ่ายเอกสารต่อได้
   อยู่นอก @media print เพื่อวัดความสูงบนจอก่อนพิมพ์ได้ (ย่อให้พอดี 1 แผ่น) */
#print-area .slip { break-after: page; font-size: 11pt; line-height: 1.45; }
#print-area .slip:last-child { break-after: auto; }
#print-area .slip-meta { font-size: 10pt; margin: -3mm 0 5mm; }
#print-area .slip-who { display: flex; align-items: baseline; gap: 4mm; margin-bottom: 4mm; }
#print-area .slip-who b { font-size: 16pt; }
#print-area .slip-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-bottom: 3mm; }
#print-area .slip-box { border: 1px solid #000; border-radius: 2mm; padding: 2.5mm 3mm; display: grid; gap: .5mm; align-content: start; }
#print-area .slip-box span { font-size: 9.5pt; }
#print-area .slip-box b { font-size: 18pt; line-height: 1.2; font-variant-numeric: tabular-nums; }
#print-area .slip-box small { font-size: 8.5pt; }
#print-area .slip-note { font-size: 9.5pt; margin: 0 0 2mm; }
#print-area .slip h3 { font-size: 11.5pt; margin: 4mm 0 1mm; }
#print-area .slip p { margin: 0; }
#print-area .slip-table { width: 100%; }
#print-area .slip-table .n { width: 22mm; text-align: center; font-variant-numeric: tabular-nums; }
#print-area .slip-table tr.sum td { font-weight: 700; }
#print-area .slip-table tbody td { height: auto; padding-block: 1.5px; }
#print-area .slip-small { font-size: 9pt; margin-top: 1mm !important; }
#print-area .slip-list { margin: 0; padding-left: 6mm; }
#print-area .slip-list.cols { columns: 2; column-gap: 10mm; }
#print-area .slip-list li { break-inside: avoid; }
#print-area .slip-lines i { display: block; height: 7mm; border-bottom: 1px dotted #000; }

/* ══ v3.16 · ความรู้สึกตอนใช้งาน ═══════════════════════════
   แอปทำงานเร็วอยู่แล้ว แต่ "รู้สึก" ไม่ลื่น เพราะกดแล้วไม่มีอะไรตอบสนอง
   สลับหน้าแบบตัดฉับ และไม่รู้ว่าข้อมูลบันทึกแล้วหรือยัง ส่วนนี้แก้ทั้งสามอย่าง */

/* ── แตะแล้วต้องรู้สึกว่ากดติด ──
   ของเดิมทั้งไฟล์มี :active แค่ 2 จุด บนมือถือกดปุ่มแล้วปุ่มนิ่งสนิท ไม่แน่ใจว่ากดโดนไหม
   ใช้ :where() ให้ความเจาะจงเป็นศูนย์ ปุ่มที่ตั้งท่ากดของตัวเองไว้แล้ว (.btn) ยังชนะเหมือนเดิม */
:where(button):not(:disabled):active { transform: scale(.96); }
/* ปุ่มกว้างเต็มแถว ยุบมากแล้วดูเหมือนทั้งแถวกระเด้ง — ยุบนิดเดียวพอ */
:where(.btn-block, .ph-main, .hero .btn, .hero-alt, .todo-row, .today-row,
  .list-row > button, .class-card > button, .multi-btn, .tt-tip-main, .kind-cell):not(:disabled):active {
  transform: scale(.985);
}
:where(.todo-row, .list-row > button, .today-row):active { background: var(--surface-2); }
.att-btn, .st-btn { transition: background .13s, color .13s, transform .08s; }
.att-btn:active { transform: scale(.9); }

/* ── เปลี่ยนหน้าแล้วเนื้อหาใหม่ค่อย ๆ จางเข้า (enter() ใน js/app.js) ──
   ขยับเฉพาะเนื้อหาหน้าใหม่ ไม่ถ่ายภาพหน้าเดิมค้างไว้ กดรัว ๆ ก็ไม่ย้อนไปหน้าก่อน และกดต่อได้ทันที
   เริ่มที่ความทึบ .35 ไม่ใช่ 0 — เห็นเนื้อหาตั้งแต่เฟรมแรก ไม่รู้สึกว่าต้องรอ */
.page-enter { animation: page-in .16s ease-out; }
@keyframes page-in { from { opacity: .35; transform: translateY(4px); } }

/* ── ป้ายสถานะการบันทึก (js/app.js · refreshSaveState) ── */
.savestate {
  position: fixed; left: 12px; z-index: 150;   /* มือถือ: ชิดซ้าย (ทับชื่อ ไม่ทับปุ่ม ม/ส/ล/ข ฝั่งขวา) */
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--r-pill);
  background: var(--surface); color: var(--ink-2); box-shadow: var(--sh-2);
  font-size: var(--fs-xs); font-weight: 600;
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.savestate[data-mode="busy"], .savestate[data-mode="ok"], .savestate[data-mode="off"] { opacity: 1; transform: none; }
.savestate[data-mode="ok"]  { color: var(--st-ok); }
.savestate[data-mode="off"] { background: var(--late-soft); color: var(--warn-ink); }
.savestate .ico-sm { width: 14px; height: 14px; }
.savestate-dot {
  width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none;
  animation: save-pulse 1s ease-in-out infinite;
}
@keyframes save-pulse { 50% { opacity: .3; } }
/* ออฟไลน์ / ส่งไม่ผ่าน = ไม่มีอะไรกำลังเกิดขึ้น จุดต้องนิ่ง กะพริบเฉพาะตอนกำลังส่งจริง */
.savestate[data-mode="off"] .savestate-dot { animation: none; }
/* ส่งไม่ผ่าน → ป้ายกดได้ · ปุ่มสูง 40 + ขอบป้าย 2+2 = แตะได้ 44 */
.savestate[data-retry] { pointer-events: auto; padding: 2px 2px 2px 12px; }
.savestate-retry {
  min-height: 40px; padding: 0 14px; border-radius: var(--r-pill);
  background: var(--surface); color: var(--warn-ink); font-weight: 700;
}
.savestate-retry:active { transform: scale(.97); }
@media (min-width: 900px) { .savestate { left: auto; right: 20px; bottom: 20px; } }
@media print { .savestate { display: none; } }

/* ── ไอคอนเส้นบนปุ่ม (แทนอีโมจิ) ──
   ปุ่มที่ไม่ใช่ .btn ไม่ได้จัดแถวไว้ ไอคอนจะลอยอยู่เหนือตัวอักษร */
.chip, .tagbtn, .tag-on, .tag-off, .rep-fresh-btn, .item-pill,
.ph-main, .ph-side, .btn-dark {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tag-on .ico-sm, .tag-off .ico-sm { width: 14px; height: 14px; }
.ph-back .ico { width: 24px; height: 24px; }
/* ป้าย "ครบแล้ว" บนมือถือ — เดิมหน้าตาเหมือนปุ่มแต่กดไม่ได้ ตอนนี้เป็นป้ายสถานะ */
.ph-side.done { background: none; color: var(--hero-ink); padding-inline: 8px; }
.ph-side.done:hover { background: none; }
/* ตัวนับ "ไม่ปกติ" เป็นตัวเลขเฉย ๆ ไม่ใช่ตัวกรอง — ข้อความธรรมดา ไม่มีกรอบแบบชิป */
.filter-count { font-size: var(--fs-sm); color: var(--ink-2); padding-inline: 4px; }
/* ชิปที่มีไอคอน + ชื่อสั้น — จอแคบเหลือแค่ไอคอน (ชื่อเต็มอยู่ใน aria-label) */
.chip-ic .ico { margin: 0; }
.chip-ic .chip-lbl { margin-left: 4px; }
@media (max-width: 480px) { .chip-ic .chip-lbl { display: none; } .chip-ic { padding-inline: 12px; } }


/* ── ช่องคะแนน ──
   เปลี่ยนเป็น type="text" + inputmode="decimal" แล้ว (ได้แป้นตัวเลขเหมือนเดิม)
   ไม่มีลูกศรขึ้นลงมาทับคำว่า "ไม่ส่ง" และหมุนล้อเมาส์ผ่านแล้วคะแนนไม่เปลี่ยนเอง */
.score-inp::placeholder { font-size: var(--fs-xs); font-weight: 600; color: var(--st-miss); opacity: 1; }

/* ── กราฟเกรด: ขั้นที่ไม่มีใครได้ ── */
.gcol.zero .gcol-n   { color: var(--ink-2); }   /* เดิมจาง .6 = 3.6:1 ไม่ผ่าน · แท่งว่างบอกว่าเป็นศูนย์อยู่แล้ว */
.gcol.zero .gcol-bar { background: var(--surface-3); }

/* ── การ์ดคู่ (หน้าแรก · รายงาน) สูงเท่ากัน ──
   ของเดิมชิดบน ใบหนึ่งสูงอีกใบเตี้ย เห็นขอบล่างไม่ตรงกันชัดบนจอคอม */
@media (min-width: 900px) {
  .home-grid, .rep-grid { align-items: stretch; }
  .stats-card { display: flex; flex-direction: column; justify-content: center; }
}

/* ── ระหว่างรอข้อมูลห้องเรียน: โครงหน้าแทนตัวหนังสือ "กำลังโหลด…" ── */
.skel { display: grid; gap: 10px; }
.skel i {
  display: block; height: 52px; border-radius: var(--r-2);
  background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%);
  background-size: 200% 100%; animation: skel-shine 1.2s ease-in-out infinite;
}
.skel i:first-child { height: 92px; }
@keyframes skel-shine { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* ── ช่องคะแนนที่พิมพ์ค่าใช้ไม่ได้ (เกินเต็ม · ติดลบ · ไม่ใช่ตัวเลข) — ยังไม่บันทึก ──
   ช่องแดงค้างไว้ + บอกเหตุใต้แถว ครูเห็นทันทีว่าแถวไหนยังไม่เข้า */
.score-inp.bad { border-color: var(--st-miss); color: var(--st-miss); background: var(--miss-soft); }
.score-err { font-size: var(--fs-sm); font-weight: 600; color: var(--st-miss); margin-top: 8px; line-height: 1.5; }
@media (max-width: 899px) {
  .work-list.st2 .work-row { flex-wrap: wrap; }
  .work-list.st2 .work-row > .score-err { order: 4; flex-basis: 100%; margin-top: 0; text-align: right; }
}
@media (min-width: 900px) {
  .work-list .work-row > .score-err { grid-column: 2 / -1; grid-row: 2; margin-top: 0; text-align: right; }
}

/* ── เมนู ⋯ แบบจัดกลุ่ม ── */
.menu-list { display: grid; gap: 8px; }
.menu-sep {
  font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3);
  margin: 10px 2px -2px;
}
.menu-sep:first-child { margin-top: 0; }
/* ล้างทั้งรายการ — ย้อนได้ (มีเลิกทำ) แต่กระทบทั้งห้อง จึงเป็นตัวหนังสือแดงบนปุ่มโปร่ง ต่างจากปุ่มลบจริง */
.btn-ghost.is-danger { color: var(--st-miss); }

/* ── หัวคอลัมน์สรุป SGS: ปุ่มคัดลอกทั้งช่อง ── */
.th-copy {
  display: block; width: 100%; padding: 0; margin: 0;
  font: inherit; color: inherit; text-align: inherit; cursor: pointer; border-radius: var(--r-sm);
}
.th-copy:hover { text-decoration: underline; text-underline-offset: 3px; }
/* สไตล์เฉพาะหน้าของนักเรียน — ต่อยอดจาก styles.css (ใช้ตัวแปรสีชุดเดียวกัน) */

.stu-wrap { max-width: 620px; margin: 0 auto; padding: 16px 14px 40px; }

/* ── หน้ากรอกเลขประจำตัว ── */
.gate { min-height: 100dvh; display: grid; align-content: center; gap: 18px; padding: 24px 16px; }
/* ไทล์สีแถบหัวกับไอคอนไลม์ — ชุดเดียวกับการ์ดคะแนนที่นักเรียนจะเห็นถัดไป
   (เดิมไล่สีเขียวน้ำทะเล + เงาเรืองแสงสีเดียวกัน หน้าตาเหมือนแอปสำเร็จรูป ไม่ใช่ของแอปนี้) */
.gate-mark {
  width: 68px; height: 68px; border-radius: var(--r-3); margin: 0 auto;
  background: var(--bar); color: var(--lime); border: 1px solid var(--bar-3);
  display: grid; place-content: center; box-shadow: var(--sh-2);
}
.gate-mark svg { width: 32px; height: 32px; }
.gate h1 { font-size: var(--fs-xl); margin: 0; text-align: center; letter-spacing: -.3px; }
.gate p  { margin: 4px 0 0; text-align: center; color: var(--ink-2); font-size: var(--fs-sm); }
.gate form { display: grid; gap: 10px; max-width: 340px; margin: 4px auto 0; width: 100%; }
.gate input::placeholder { color: var(--ink-3); opacity: .45; }
.gate input {
  text-align: center; font-size: var(--fs-2xl); font-weight: 700; letter-spacing: 3px;
  padding: 14px 12px; font-variant-numeric: tabular-nums;
}
.gate .foot { text-align: center; font-size: var(--fs-xs); color: var(--ink-3); margin-top: 6px; }

.err {
  background: var(--red-soft); color: var(--st-miss); border-radius: var(--r-1);
  padding: 11px 13px; font-size: var(--fs-sm); font-weight: 600; text-align: center;
}

.tip { font-size: var(--fs-xs); color: var(--ink-3); text-align: center; margin-top: 18px; line-height: 1.6; }

/* ── หน้านักเรียน: แถบเข้มบนสุด ───────────────────────────── */
.stu-hero {
  background: var(--bar); color: var(--bar-ink);
  padding: calc(18px + env(safe-area-inset-top)) 18px 22px;
  border-radius: 0 0 28px 28px;
  display: flex; flex-direction: column; gap: 16px;
}
.hero-row { display: flex; align-items: flex-start; gap: 10px; }
.hero-kick {
  font-size: var(--fs-sm); font-weight: 500; color: var(--bar-ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hero-name {
  font-size: var(--fs-xl); font-weight: 700; color: #fff; margin-top: 2px; letter-spacing: -.2px;
  overflow: hidden; text-overflow: ellipsis;
}
/* ท้ายหน้า: ดูของเลขไหนอยู่ + ออก (ย้ายมาจากแถบเข้มบนสุด ที่เคยอยู่ติดปุ่มแชร์) */
.stu-out {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: var(--fs-sm); color: var(--ink-2);
}
.stu-out b { color: var(--ink); }
.stu-out .btn { flex: none; min-height: 44px; padding-inline: 18px; }
.hero-back {
  flex: none; width: 44px; height: 44px; margin: -10px 0 -10px -12px;
  display: grid; place-content: center; border-radius: var(--r-1); color: var(--bar-ink);
}
.hero-back:hover { background: var(--bar-2); }
.hero-back .ico { width: 24px; height: 24px; }

/* เลือกวิชา — ปัดซ้ายขวาได้ วิชาที่ดูอยู่เป็นสีมะนาว */
.hero-subj {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -18px; padding: 0 18px;
}
.hero-subj::-webkit-scrollbar { display: none; }
.subj-pill {
  flex: none; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); white-space: nowrap;
  border: 1px solid var(--bar-3); background: var(--bar-2); color: #fff;
  font-size: var(--fs-md); font-weight: 500;
}
.subj-pill[aria-current="true"] {
  background: var(--bar-ink); border-color: var(--bar-ink); color: var(--bar); font-weight: 700;
}

.hero-score { display: flex; align-items: flex-end; gap: 12px; }
.hero-lbl { font-size: var(--fs-sm); color: var(--bar-ink-2); }
.hero-big { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 4px; }
.hero-big b { font-size: 48px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; color: var(--lime); }
.hero-big span { font-size: var(--fs-lg); font-weight: 600; color: var(--bar-ink-2); }
.hero-att { flex: none; text-align: right; padding: 10px 14px; border-radius: var(--r-2); background: var(--bar-2); }
.hero-att span { display: block; font-size: var(--fs-xs); color: var(--bar-ink-2); }
.hero-att b { display: block; font-size: var(--fs-xl); font-weight: 700; color: #fff; }

/* ช่องตัวเลขย่อย (หน้าสรุปผล · หน้ารายละเอียดงาน) */
.hero-mini { display: flex; gap: 8px; }
.mini { flex: 1; min-width: 0; background: var(--bar-2); border-radius: var(--r-2); padding: 10px 12px; }
.mini-l { font-size: var(--fs-xs); color: var(--bar-ink-2); }
.mini-v {
  font-size: var(--fs-base); font-weight: 700; color: #fff; margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── รายการงาน / คะแนนสอบ ─────────────────────────────────── */
.card-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.card-h b { font-size: var(--fs-sm); font-weight: 700; color: var(--ink); }
.card-h span { font-size: var(--fs-xs); color: var(--ink-3); }
.rows { display: flex; flex-direction: column; gap: 9px; }
.srow {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--r-1); background: var(--surface-2);
}
.srow:not(.static):hover { background: var(--surface-3); }
.srow.bad  { background: var(--miss-soft); }
.srow.warn { background: var(--late-soft); }
.srow.hi   { background: var(--accent-soft); }
.srow.dim  { opacity: .65; }
.srow-name {
  font-size: var(--fs-md); color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.srow-sub { font-size: var(--fs-xs); color: var(--ink-2); margin-top: 1px; }

/* ป้ายผ่าน/ไม่ผ่านเกณฑ์ — อยู่ใต้ชื่อรายการ ไม่ใช่ในช่องคะแนน
   เพราะ 'ได้กี่คะแนน' กับ 'ผ่านไหม' เป็นคนละคำถาม เด็กอ่านทีละอย่าง */
.pass-tag {
  display: inline-block; margin-top: 4px; padding: 2px 8px;
  border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600;
}
.pass-tag.ok  { background: var(--ok-soft, rgba(45,160,90,.14)); color: var(--st-ok); }
.pass-tag.bad { background: var(--red-soft); color: var(--st-miss); }
.pass-tag.retake { background: var(--purple-soft); color: var(--purple); margin-right: 6px; }
.srow-tag {
  flex: none; font-size: var(--fs-sm); font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--st-ok);
}
.srow-tag.bad    { color: var(--st-miss); }
.srow-tag.warn   { color: var(--st-late); }
.srow-tag.accent { color: var(--accent-ink); font-size: var(--fs-base); }
.srow-tag.none   { color: var(--ink-3); font-weight: 600; }
.srow-go { flex: none; color: var(--ink-3); font-size: var(--fs-md); }
.srow.bad .srow-go  { color: var(--st-miss); }
.srow.warn .srow-go { color: var(--st-late); }

/* ── หน้ารายละเอียดงาน ────────────────────────────────────── */
.note {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: var(--r-2); background: var(--surface-2);
  margin-bottom: 10px;
}
.note.bad  { background: var(--miss-soft); }
.note.warn { background: var(--late-soft); }
.note b { display: block; font-size: var(--fs-sm); font-weight: 700; color: var(--ink); }
.note span { display: block; font-size: var(--fs-xs); color: var(--ink-2); margin-top: 1px; }
.note.bad b, .note.bad span   { color: var(--st-miss); }
.note.warn b, .note.warn span { color: var(--warn-ink); }
.prose { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.8; white-space: pre-wrap; }


/* ── สลับ รายวิชา / สรุปผลภาคเรียน ────────────────────────── */
.stu-seg {
  display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 16px;
  background: var(--surface-3); border-radius: var(--r-2); padding: 4px;
}
.stu-seg button { min-height: 44px; font-size: var(--fs-base); font-weight: 600; border-radius: var(--r-1); color: var(--ink-2); }
.stu-seg button[data-on="1"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--sh-1); }

/* เส้นประของช่องที่ "ล็อก/รอ" — ใช้ร่วมกันทุกที่ ให้เด็กจำได้ว่าเส้นประ = ครูยังไม่ประกาศ */
.stu-wrap { --dash: color-mix(in srgb, var(--ink-3) 55%, transparent); }

/* ── หน้ารายวิชา: การ์ดครึ่งภาค ────────────────────────────── */
.phase { padding: 0; overflow: hidden; margin-bottom: 14px; }
.phase-h {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 16px; text-align: left; color: var(--ink);
}
.phase-name { font-size: var(--fs-lg); font-weight: 700; color: var(--ink); }
.phase-sub  { font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 1px; }
.phase .frac.lg b { font-size: var(--fs-3xl); }
.phase .frac.lg small { font-size: var(--fs-base); }
.phase-chev { flex: none; width: 20px; height: 20px; color: var(--ink-3); transform: rotate(180deg); transition: transform .2s; }
.phase.shut .phase-chev { transform: none; }
.phase.shut .bks { display: none; }

/* หน้ารายวิชาอ่านบนมือถือเป็นหลัก — ตัวหนังสือใหญ่กว่าส่วนอื่นของแอป */
.bks { border-top: 1px solid var(--line); }
.bk { padding: 14px 16px 15px; border-bottom: 1px solid var(--line); }
.bk:last-child { border-bottom: none; }
.bk-h { display: flex; align-items: center; gap: 12px; }
.bk-ico {
  flex: none; width: 36px; height: 36px; border-radius: var(--r-1); display: grid; place-content: center;
  background: var(--accent-soft); color: var(--accent-ink);
}
.bk-ico .ico { width: 20px; height: 20px; }
.bk-name { font-size: var(--fs-lg); font-weight: 700; color: var(--ink); letter-spacing: -.2px; }
.bk-sub  { font-size: var(--fs-sm); color: var(--ink-2); }
.bk-h .frac b { font-size: var(--fs-2xl); letter-spacing: -.4px; }
.bk-h .frac small { font-size: var(--fs-md); }
.bk-bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin: 10px 0 0 48px; }
.bk-bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

/* รายการย่อยเยื้องเข้าไปใต้ชื่อหัวข้อ · ไม่มีกล่องพื้นสี เหลือเส้นคั่นบาง ๆ — สถานะบอกด้วยป้ายทางขวา */
.bk .rows { margin: 10px 0 0 48px; gap: 0; border-top: 1px solid var(--line); }
.bk .srow,
.bk .srow.bad, .bk .srow.warn, .bk .srow.hi {
  padding: 8px 0; min-height: 44px; border-radius: 0; background: transparent;
  border-bottom: 1px solid var(--line);
}
.bk .srow:last-child { border-bottom: none; }
.bk .srow:not(.static):hover { background: var(--surface-2); }
.bk .srow-name { font-size: var(--fs-md); color: var(--ink-2); }
.bk .srow-sub  { font-size: var(--fs-xs); }
.bk .srow-tag  {
  font-size: var(--fs-sm); padding: 3px 9px; border-radius: var(--r-pill); background: var(--ok-soft);
}
.bk .srow-tag.bad  { background: var(--miss-soft); }
.bk .srow-tag.warn { background: var(--late-soft); }
.bk .srow-tag.none { background: var(--surface-2); }
.bk .pass-tag  { font-size: var(--fs-xs); }
.bk.nodata .bk-name { color: var(--ink-2); }

/* ── หน้ารายวิชา: การ์ดสอบกลางภาค/ปลายภาค ──────────────────── */
.exam {
  background: var(--bar); color: var(--bar-ink); border-radius: var(--r-3);
  padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 12px;
}
.exam-h { display: flex; align-items: center; gap: 8px; }
.exam-h b { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 700; }
.exam-h .ico { width: 18px; height: 18px; flex: none; }
.exam-tag {
  flex: none; font-size: var(--fs-xs); font-weight: 700; padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--bar-3); color: var(--bar-ink);
}
.exam-score { display: flex; align-items: flex-end; gap: 12px; }
.exam-score > span { font-size: var(--fs-sm); color: var(--bar-ink-2); }
.exam-big { flex: 1; display: flex; align-items: baseline; gap: 4px; }
.exam-big b { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; color: var(--lime); }
.exam-big span { font-size: var(--fs-base); font-weight: 600; color: var(--bar-ink-2); }
.exam-bar { height: 8px; border-radius: 4px; background: var(--bar-3); overflow: hidden; }
.exam-bar i { display: block; height: 100%; border-radius: 4px; background: var(--lime); }
.exam .pass-tag { margin-top: 0; }

/* ยังไม่มีคะแนน = การ์ดขาวธรรมดา · ครูยังปิด = เส้นประ + กุญแจ */
.exam.wait, .exam.lock { color: var(--ink); gap: 4px; }
.exam.wait { background: var(--surface); box-shadow: var(--sh-1); }
.exam.lock { background: transparent; border: 2px dashed var(--dash); }
.exam.wait p, .exam.lock p { margin: 0; font-size: var(--fs-md); font-weight: 500; color: var(--ink); }
.exam.wait p { color: var(--ink-2); }
.exam.lock small { font-size: var(--fs-xs); color: var(--ink-2); }
.exam.lock .ico { color: var(--ink-2); }
.exam .frac b { font-size: var(--fs-lg); }
.exam .frac small { font-size: var(--fs-sm); }

/* ── หน้าสรุปผลภาคเรียน ───────────────────────────────────── */
.sum-card { display: block; width: 100%; text-align: left; scroll-margin-top: 12px; padding: 18px 16px; }
.sum-top { display: flex; align-items: flex-start; gap: 12px; }
.sum-subj {
  font-size: var(--fs-lg); font-weight: 700; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sum-code { font-size: var(--fs-sm); color: var(--ink-2); margin-top: 1px; }
.sum-grade {
  flex: none; width: 64px; height: 64px; border-radius: var(--r-3); box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--ink-2);
}
.sum-grade span { display: block; font-size: var(--fs-xs); font-weight: 600; }
.sum-grade b { display: block; font-size: var(--fs-2xl); line-height: 1.1; font-weight: 700; color: var(--ink); }
.sum-grade.ok   { background: var(--ok-soft); }
.sum-grade.ok b, .sum-grade.ok span { color: var(--st-ok); }
.sum-grade.warn { background: var(--late-soft); }
.sum-grade.warn b, .sum-grade.warn span { color: var(--warn-ink); }
.sum-grade.bad  { background: var(--miss-soft); }
.sum-grade.bad b, .sum-grade.bad span { color: var(--st-miss); }
.sum-grade.wait { background: transparent; border: 1.5px dashed var(--dash); }
.sum-grade.wait b { color: var(--ink-2); }

.sum-total { display: flex; align-items: baseline; gap: 6px; margin-top: 12px; }
.sum-total b { font-size: 40px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -1.2px; }
.sum-total span { font-size: var(--fs-base); font-weight: 600; color: var(--ink-2); }

/* ป้ายสถานะข้างคะแนนรวม */
.sum-total .st-pill { margin-left: auto; align-self: center; }
.st-pill {
  flex: none; padding: 3px 10px; border-radius: var(--r-pill); font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.st-pill.ok   { background: var(--ok-soft);   color: var(--st-ok); }
.st-pill.warn { background: var(--late-soft); color: var(--warn-ink); }
.st-pill.bad  { background: var(--miss-soft); color: var(--st-miss); }

/* 4 ช่วงของภาคเรียนวางเรียงกัน — ช่องสอบที่ประกาศแล้วเป็นสีเข้มแบบเดียวกับหน้ารายวิชา */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.step { padding: 10px 8px; border-radius: var(--r-2); background: var(--surface-2); min-width: 0; box-sizing: border-box; }
.step > span { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.step .frac { display: block; margin-top: 4px; }
.step .frac b { font-size: var(--fs-lg); }
.step .frac small { font-size: var(--fs-xs); }
.step.ex { background: var(--bar); }
.step.ex > span, .step.ex .frac small { color: var(--bar-ink-2); }
.step.ex .frac b { color: var(--lime); }
.step.lock { background: transparent; border: 1.5px dashed var(--dash); }

/* ตัวเลข ได้/เต็ม — ตัวได้หนา ตัวเต็มจาง อ่านทีละส่วนได้ไว */
.frac { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.frac b { font-size: var(--fs-md); font-weight: 700; color: var(--ink); }

.ov { padding: 6px 0; }
.ov-row {
  display: grid; grid-template-columns: 1fr 84px 56px 18px; align-items: center; gap: 8px;

}
button.ov-row:hover { background: var(--surface-2); }
.ov-head { border-top: none; min-height: 0; padding-top: 6px; padding-bottom: 6px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.ov-subj { min-width: 0; }
.ov-subj b {
  display: block; font-size: var(--fs-base); font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ov-subj small { display: block; font-size: var(--fs-xs); color: var(--ink-2); }
.ov-total { text-align: right; font-size: var(--fs-lg); font-weight: 700; color: var(--ink); white-space: nowrap; }
.ov-total small { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
.ov-head .ov-total { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.ov-grade { text-align: center; }
.gpill {
  display: inline-block; min-width: 46px; padding: 4px 8px; border-radius: var(--r-pill); box-sizing: border-box;
  font-style: normal; font-size: var(--fs-base); font-weight: 700; text-align: center;
  background: var(--surface-2); color: var(--ink-3);
}
.gpill.ok   { background: var(--ok-soft);   color: var(--st-ok); }
.gpill.warn { background: var(--late-soft); color: var(--warn-ink); }
.gpill.bad  { background: var(--miss-soft); color: var(--st-miss); }
.gpill.wait { background: transparent; border: 1.5px dashed var(--dash); color: var(--ink-2); padding: 3px 8px; }

.sum-more {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  margin-top: 14px; min-height: 48px; border-radius: var(--r-2);
  font-size: var(--fs-base); font-weight: 700; color: var(--accent-ink); background: var(--accent-soft);
}
.sum-more:hover { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.sum-more span { font-size: var(--fs-lg); line-height: 1; }

.sum-note {
  margin-top: 12px; font-size: var(--fs-sm); line-height: 1.6; color: var(--ink-2);
  padding: 10px 12px; border-radius: var(--r-1); background: var(--surface-2);
}
.sum-note.ok   { background: var(--ok-soft);   color: var(--st-ok); font-weight: 600; }
.sum-note.warn { background: var(--late-soft); color: var(--warn-ink); font-weight: 600; }
.sum-note.bad  { background: var(--miss-soft); color: var(--st-miss); font-weight: 600; }
.sum-note.lock { display: flex; gap: 10px; align-items: flex-start; color: var(--ink); }
.sum-note.lock .ico { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--ink-2); }

@media (min-width: 760px) {
  .stu-hero { padding: 22px 24px 24px; }
  .stu-hero > * { width: 100%; max-width: 620px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  .hero-subj { margin: 0 auto; padding: 0; }
}

/* โหมดมืด: แถบเข้มกับพื้นหน้าเกือบสีเดียวกัน — ใส่ขอบให้การ์ดสอบแยกออกจากพื้น */
[data-theme="dark"] .exam:not(.wait):not(.lock),
[data-theme="dark"] .step.ex { box-shadow: inset 0 0 0 1px var(--bar-3); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .exam:not(.wait):not(.lock),
  :root:not([data-theme="light"]) .step.ex { box-shadow: inset 0 0 0 1px var(--bar-3); }
}

/* คะแนนบนแถวสีเทาเข้มของโหมดมืด — --st-ok ยังสว่างไม่พอ (วัดได้ 4.33 ต้องการ 4.5)
   ใช้ :not() กันไม่ให้ทับสีของแถวที่มีสถานะเฉพาะ */
[data-theme="dark"] .srow-tag:not(.bad):not(.warn):not(.accent):not(.none) { color: #41bf6d; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .srow-tag:not(.bad):not(.warn):not(.accent):not(.none) { color: #41bf6d; }
}

/* ── แถบความคืบหน้าคะแนนสะสม (แถบเข้มบนสุด) ──

.hero-prog { display: flex; flex-direction: column; gap: 8px; margin-top: -4px; }
.hero-track { position: relative; height: 8px; border-radius: var(--r-pill); background: var(--bar-3); overflow: hidden; }
.hero-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-pill); }
.hero-track .chk { background: color-mix(in srgb, var(--lime) 28%, var(--bar-3)); }
.hero-track .got { background: var(--lime); }
.hero-att.risk { box-shadow: inset 0 0 0 1.5px var(--st-miss); }
.hero-att.risk b { color: #ff9db5; }

/* ── กล่อง "ต้องจัดการ" ── */
.todo {
  border-radius: var(--r-3); background: var(--surface); box-shadow: var(--sh-1);

.todo-h b { flex: 1; font-size: var(--fs-base); font-weight: 700; }

.todo-item {

}
.todo-item:first-of-type { border-top: none; }
button.todo-item:hover { background: var(--surface-2); }
.todo-item > .ico { flex: none; width: 20px; height: 20px; color: var(--st-miss); }
.todo-main { flex: 1; min-width: 0; }
.todo-main b { display: block; font-size: var(--fs-md); font-weight: 700; }

/* ── ลูกศรไปต่อ / ป้ายรอครู ── */

.hero-icon .ico { width: 20px; height: 20px; }
.hero-icon.spinning .ico { animation: spin .8s linear infinite; }
.hero-icon:disabled { cursor: default; }

.stu-toasts {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 200;
  bottom: calc(20px + env(safe-area-inset-bottom));
  width: max-content; max-width: calc(100vw - 32px);
}

/* ช่องตัวเลขบนแถบเข้มที่มีเรื่องต้องระวัง */
.mini.bad { box-shadow: inset 0 0 0 1.5px var(--st-miss); }

/* ── หน้าสรุป: ตารางภาพรวมกดเข้ารายวิชา · การ์ดรายละเอียดแบบกระชับ ── */

.sum-card.compact .sum-more { min-height: 44px; font-size: var(--fs-md); margin-top: 12px; }

/* ── แชร์เป็นรูปสตอรี่ ── */
.story-sheet h2 { text-align: center; }
.story-frame {
  position: relative; margin: 0 auto; aspect-ratio: 9 / 16;
  height: min(52vh, 480px); max-width: 100%;

.story-frame.busy .story-img { visibility: hidden; }
.story-frame.busy::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, #0b2b24 0%, #12463a 50%, #0b2b24 100%);
  background-size: 200% 100%; animation: skel-shine 1.2s ease-in-out infinite;
}
.story-opts { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 6px; }
.story-opt { margin: 0; padding: 6px 0; }
.story-themes { display: flex; gap: 10px; }
.story-theme {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  box-shadow: 0 0 0 1px var(--line-2); transition: box-shadow .15s;
}
.story-theme[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.story-acts { display: grid; gap: 10px; margin-top: 6px; }
.story-acts .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.story-acts .btn[hidden] { display: none; }   /* แชร์ไฟล์ไม่ได้ (คอมส่วนใหญ่) — เหลือปุ่มบันทึกรูป */
.story-acts .ico { width: 18px; height: 18px; }
.story-sheet .hint { text-align: center; }
.story-close {
  display: block; width: 100%; min-height: 44px; margin-top: 4px;
  font-size: var(--fs-md); font-weight: 600; color: var(--ink-2);
}
